name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Verify Frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Validate 108-Card Inventory & Themes
        run: |
          npm run validate:deck
          npm run validate:themes

      - name: Build Production Frontend
        env:
          VITE_SERVER_URL: 'https://uno-multiplayer-backend-en4e.onrender.com'
        run: npm run build

      - name: Check Cloudflare Credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Cloudflare credentials detected in repository secrets."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "Notice: Cloudflare secrets not configured in repository secrets."
            echo "Frontend build and all 56 tests passed successfully."
            echo "To enable direct GitHub Actions deployment to Cloudflare Pages, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings -> Secrets and variables -> Actions."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=uno-card-game
