<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 336" width="240" height="336" data-card-id="blue-7-1" data-card-key="blue-7" data-theme="halloween">
  <defs>
    <!-- Card Body Dark Midnight Gradient -->
    <linearGradient id="card-grad-blue-7-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="45%" stop-color="#050D1E" />
      <stop offset="100%" stop-color="#070208" />
    </linearGradient>

    <!-- Blood Moon Gradient for Red -->
    <radialGradient id="blood-moon-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="30%" stop-color="#E11D48" />
      <stop offset="85%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Ruby Gem Gradient -->
    <linearGradient id="ruby-gem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="35%" stop-color="#FF4D6D" />
      <stop offset="80%" stop-color="#BA0D28" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <!-- Ghost Cyan Gradient for Blue -->
    <linearGradient id="ghost-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#BAE6FD" />
      <stop offset="80%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Potion Vapor Gradient for Green -->
    <radialGradient id="potion-vapor-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECFDF5" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </radialGradient>

    <!-- Harvest Moon Gradient for Yellow -->
    <radialGradient id="harvest-moon-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#9A3412" />
    </radialGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow-main" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="drop-shadow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Clip path for card corner rounding -->
    <clipPath id="hw-card-body-clip-blue-7-1">
      <rect x="8" y="8" width="224" height="320" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- 1. Physical Card Base (Gothic Obsidian Rim with Gold Trim) -->
  <rect x="1" y="1" width="238" height="334" rx="18" ry="18" fill="#0C0512" stroke="#A5B4FC" stroke-width="2.2" />

  <!-- 2. Inner Card Body with rich color fill -->
  <g clip-path="url(#hw-card-body-clip-blue-7-1)">
    <rect x="8" y="8" width="224" height="320" rx="14" ry="14" fill="url(#card-grad-blue-7-1)" />

    <!-- Gothic Ornamental Inner Filigree Frame -->
    <rect x="14" y="14" width="212" height="308" rx="10" ry="10" fill="none" stroke="#A5B4FC" stroke-width="1.4" opacity="0.85" />
    <rect x="17" y="17" width="206" height="302" rx="8" ry="8" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />

    <!-- Corner Spiderwebs -->
    <g transform="translate(16, 16)" opacity="0.35">
      <path d="M 0 0 L 26 0 M 0 0 L 22 14 M 0 0 L 14 22 M 0 0 L 0 26" stroke="#FFFFFF" stroke-width="0.7" />
      <path d="M 8 0 Q 6 5 0 8 M 16 0 Q 12 10 0 16 M 24 0 Q 18 16 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.6" />
    </g>
    <g transform="translate(224, 16) scale(-1, 1)" opacity="0.35">
      <path d="M 0 0 L 26 0 M 0 0 L 22 14 M 0 0 L 14 22 M 0 0 L 0 26" stroke="#FFFFFF" stroke-width="0.7" />
      <path d="M 8 0 Q 6 5 0 8 M 16 0 Q 12 10 0 16 M 24 0 Q 18 16 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.6" />
    </g>
    <g transform="translate(16, 320) scale(1, -1)" opacity="0.35">
      <path d="M 0 0 L 26 0 M 0 0 L 22 14 M 0 0 L 14 22 M 0 0 L 0 26" stroke="#FFFFFF" stroke-width="0.7" />
      <path d="M 8 0 Q 6 5 0 8 M 16 0 Q 12 10 0 16 M 24 0 Q 18 16 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.6" />
    </g>
    <g transform="translate(224, 320) scale(-1, -1)" opacity="0.35">
      <path d="M 0 0 L 26 0 M 0 0 L 22 14 M 0 0 L 14 22 M 0 0 L 0 26" stroke="#FFFFFF" stroke-width="0.7" />
      <path d="M 8 0 Q 6 5 0 8 M 16 0 Q 12 10 0 16 M 24 0 Q 18 16 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.6" />
    </g>

    <!-- 3. Central Gothic Arch/Vignette Backdrop -->
    <g filter="url(#drop-shadow-main)">
      <path d="M 45 240 L 45 130 C 45 65, 195 65, 195 130 L 195 240 Z" fill="#0C0412" stroke="#38BDF8" stroke-width="2.5" opacity="0.8" />
      <path d="M 49 238 L 49 132 C 49 72, 191 72, 191 132 L 191 238 Z" fill="none" stroke="#A5B4FC" stroke-width="1.2" opacity="0.7" />
    </g>

    <!-- 4. Thematic Unique Artwork for This Specific Card -->
    
      <g id="art-blue-7">
        <!-- Seven Glowing Cyan Stars (Constellation Pattern) -->
        
    <polygon points="75,101.5 76.05,103.95 78.5,105 76.05,106.05 75,108.5 73.95,106.05 71.5,105 73.95,103.95" fill="#00F0FF" opacity="0.95" />
  
        
    <polygon points="95,111.8 95.96,114.04 98.2,115 95.96,115.96 95,118.2 94.04,115.96 91.8,115 94.04,114.04" fill="#00F0FF" opacity="0.9" />
  
        
    <polygon points="120,96 121.2,98.8 124,100 121.2,101.2 120,104 118.8,101.2 116,100 118.8,98.8" fill="#FFFFFF" opacity="1" />
  
        
    <polygon points="145,104.8 145.96,107.04 148.2,108 145.96,108.96 145,111.2 144.04,108.96 141.8,108 144.04,107.04" fill="#00F0FF" opacity="0.9" />
  
        
    <polygon points="165,118.5 166.05,120.95 168.5,122 166.05,123.05 165,125.5 163.95,123.05 161.5,122 163.95,120.95" fill="#00F0FF" opacity="0.95" />
  
        
    <polygon points="135,132 135.9,134.1 138,135 135.9,135.9 135,138 134.1,135.9 132,135 134.1,134.1" fill="#BAE6FD" opacity="0.85" />
  
        
    <polygon points="110,139 110.9,141.1 113,142 110.9,142.9 110,145 109.1,142.9 107,142 109.1,141.1" fill="#BAE6FD" opacity="0.85" />
  

        <!-- Constellation Lines -->
        <polyline points="75,105 95,115 120,100 145,108 165,122 135,135 110,142 95,115" stroke="#38BDF8" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.6" />

        <!-- Gnarled Dead Oak Branch -->
        <path d="M 65 210 Q 110 180, 175 195 L 175 220 Q 120 200, 65 225 Z" fill="#08142A" stroke="#0369A1" stroke-width="1.5" />
        <path d="M 120 188 Q 135 165, 155 170" stroke="#0369A1" stroke-width="2.5" fill="none" />

        <!-- Spectral Black Cat Silhouette Perched -->
        <g transform="translate(108, 172)">
          <!-- Arched Back Body -->
          <path d="M 0 15 C -8 15, -14 0, -8 -8 C -4 -16, 8 -16, 12 -4 C 14 6, 8 15, 0 15 Z" fill="#030814" stroke="#38BDF8" stroke-width="1.8" />
          <!-- Head & Pointed Ears -->
          <circle cx="12" cy="-12" r="8" fill="#030814" stroke="#38BDF8" stroke-width="1.5" />
          <polygon points="8,-18 10,-26 14,-20" fill="#38BDF8" />
          <polygon points="15,-18 18,-26 20,-18" fill="#38BDF8" />
          <!-- Glowing Eyes staring up at stars -->
          <circle cx="14" cy="-14" r="1.8" fill="#00F0FF" filter="url(#glow-soft)" />
          <circle cx="18" cy="-13" r="1.8" fill="#00F0FF" filter="url(#glow-soft)" />
          <!-- Curled Tail hanging down branch -->
          <path d="M -8 10 Q -18 20, -12 34" stroke="#00F0FF" stroke-width="2.5" fill="none" />
        </g>
      </g>
    

    <!-- 5. Dominant Central Numeral (for Number Cards) -->
    
    <!-- Dominant Central Numeral -->
    <g filter="url(#drop-shadow-main)">
      <!-- Gothic drop-shadow & outline -->
      <text x="120" y="168" text-anchor="middle" dominant-baseline="central"
            font-family="'Impact', 'Arial Black', -apple-system, sans-serif"
            font-size="94" font-weight="900" fill="#FFFFFF"
            stroke="#050D1E" stroke-width="9" paint-order="stroke fill" opacity="0.95">7</text>
      <text x="120" y="168" text-anchor="middle" dominant-baseline="central"
            font-family="'Impact', 'Arial Black', -apple-system, sans-serif"
            font-size="94" font-weight="900" fill="#FFFFFF"
            stroke="#A5B4FC" stroke-width="2" paint-order="stroke fill">7</text>
      
    </g>
  

    <!-- 6. Top-Left Corner Symbol -->
    <g transform="translate(30, 36)" filter="url(#drop-shadow-subtle)">
      
    <g>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
            font-family="'Impact', 'Arial Black', -apple-system, sans-serif"
            font-size="30" font-weight="900" fill="#FFFFFF"
            stroke="#050D1E" stroke-width="3" paint-order="stroke fill">7</text>
      
    </g>
  
    </g>

    <!-- 7. Bottom-Right Corner Symbol (180deg rotated) -->
    <g transform="translate(210, 300) rotate(180)" filter="url(#drop-shadow-subtle)">
      
    <g>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
            font-family="'Impact', 'Arial Black', -apple-system, sans-serif"
            font-size="30" font-weight="900" fill="#FFFFFF"
            stroke="#050D1E" stroke-width="3" paint-order="stroke fill">7</text>
      
    </g>
  
    </g>
  </g>
</svg>